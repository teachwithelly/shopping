<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Quest | TeachwithElly</title><style>
:root{--ink:#34354c;--muted:#77788c;--lav:#e9e2ff;--mint:#d9f3e9;--peach:#ffe4d6;--cream:#fff9ed;--pink:#f9e0ed;--bg:#f8f7fc;--line:#e9e5f0;--purple:#7762b9;--good:#287b65;--bad:#bd5870}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px 17px;font-weight:700;background:var(--lav);color:var(--ink);transition:.2s}button:hover{transform:translateY(-2px);filter:brightness(.98)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:var(--purple);color:white}.mint{background:var(--mint)}.peach{background:var(--peach)}.outline{background:white;border:1px solid var(--line)}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side{background:white;border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:23px;font-weight:900;line-height:1.15;padding:10px 12px 20px}.brand span{color:var(--purple)}.side button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;font-size:13px;font-weight:700;padding:11px}.side button.active{background:var(--lav);color:#4b3888}.main{padding:28px clamp(15px,4vw,54px);max-width:1150px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.pill{background:white;border:1px solid var(--line);border-radius:30px;padding:8px 12px;color:var(--muted);font-size:12px}.hero{background:linear-gradient(120deg,var(--lav),var(--peach) 65%,var(--cream));padding:38px;border-radius:28px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:'🛍️ ✨ 🛒';position:absolute;right:30px;top:35px;font-size:54px;opacity:.7}.hero h1{font-size:clamp(32px,5vw,54px);margin:0 0 10px;max-width:560px}.hero p{max-width:540px;line-height:1.6}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 8px 25px #37314c08}.panel h2{margin:0 0 8px;font-size:25px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{background:var(--cream);padding:20px;border-radius:19px;border:1px solid #f0e9dc}.tile:nth-child(4n+2){background:var(--mint)}.tile:nth-child(4n+3){background:var(--pink)}.tile:nth-child(4n+4){background:var(--lav)}.tile h3{margin:7px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.navbottom{display:flex;justify-content:space-between;margin:24px 0}.question{font-size:22px;font-weight:800;line-height:1.45;margin:18px 0}.choice{display:block;text-align:left;width:100%;background:#f8f7fc;border:2px solid transparent;margin:9px 0;padding:14px}.choice.selected{border-color:var(--purple);background:var(--lav)}.choice.correct{border-color:#7bbca5;background:var(--mint)}.choice.wrong{border-color:#e8a0ac;background:var(--pink)}.progress{height:9px;border-radius:20px;background:#eeeaf4;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:var(--purple);transition:.3s}.card{border:2px dashed #dcd4ed;border-radius:20px;padding:25px;text-align:center;background:#fcfaff}.card .word{font-size:28px;font-weight:900}.ipa{color:var(--purple);font-size:17px;margin:8px}.def{line-height:1.6}.exercise{padding:15px;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.exercise select,.exercise input,.exercise textarea{width:100%;border:1px solid #ded9e8;border-radius:12px;padding:12px;background:#fcfbff;color:var(--ink);margin-top:8px}.exercise input{max-width:440px}.feedback{font-size:13px;margin-top:7px;font-weight:700}.good{color:var(--good)}.bad{color:var(--bad)}.chip{display:inline-block;background:var(--lav);padding:9px 13px;border-radius:13px;margin:4px;font-size:13px;font-weight:700}.hidden{display:none!important}.statement{background:var(--cream);padding:15px;border-radius:15px;margin:9px 0}.wheel{width:min(300px,85vw);height:min(300px,85vw);border-radius:50%;background:conic-gradient(#f6c8b4 0 45deg,#d8d0fb 45deg 90deg,#c8eadd 90deg 135deg,#f8dce8 135deg 180deg,#ffe6ae 180deg 225deg,#d6e8ff 225deg 270deg,#e8d6f6 270deg 315deg,#d9f1d1 315deg);border:12px solid white;box-shadow:0 8px 25px #7b709b25;display:grid;place-items:center;margin:20px auto;transition:transform .65s ease}.wheel span{background:white;border-radius:50%;padding:30px;font-weight:900;font-size:26px}.shopdrop{border:2px dashed #bdb4d9;padding:16px;border-radius:16px;min-height:90px;background:#faf9ff}.shopdrop.over{background:var(--mint)}.dragitem{display:inline-block;background:var(--peach);padding:10px 13px;border-radius:12px;margin:5px;cursor:grab}.tag{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:900;color:var(--purple)}.result{font-size:25px;font-weight:900;padding:20px;background:var(--mint);border-radius:20px;margin:15px 0}.reading{font-size:17px;line-height:1.85;background:var(--cream);padding:23px;border-radius:20px}.reading strong{color:#7762b9}.mobilemenu{display:none}@media(max-width:800px){.shell{display:block}.side{display:none;position:fixed;z-index:20;top:0;left:0;width:270px;box-shadow:0 0 0 100vmax #25213b55}.side.open{display:block}.mobilemenu{display:inline-block}.main{padding:16px}.hero{padding:26px}.hero:after{position:static;display:block;font-size:34px}.grid{grid-template-columns:1fr}.panel{padding:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><aside class="side" id="sidebar"><div class="brand">🛍️ Shopping<br><span>Quest!</span></div><div id="menu"></div><p class="sub" style="padding:12px">Made for creative English lessons ✨<br><b>TeachwithElly</b></p></aside><main class="main"><div class="top"><button class="mobilemenu outline" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button><span class="pill">A2+ · English · Interactive lesson</span><button class="outline" onclick="go(0)">⌂ Home</button></div><div id="screen"></div><div class="navbottom"><button class="outline" id="prev" onclick="go(page-1)">← Previous</button><button class="primary" id="next" onclick="go(page+1)">Next →</button></div></main></div><script>
const sections=['Home','Shopping Personality Test','Shops & Places','Match the Definitions','Drag & Drop Shops','Complete the Dialogues','Shopping Expressions','Match the Expressions','Complete the Sentences','Shopping Problems','Shopping Talk Randomizer','Grammar Rule','FOR or SINCE?','Grammar Gap Fill','Correct the Mistakes','Grammar Matching','Grammar Randomizer','Two Truths & a Lie','Oliver’s Shopping Disaster','Reading Check','Vocabulary Detective','Grammar Detective','Choose a Gift','Write to Oliver'];let page=0;const $=id=>document.getElementById(id);const state={test:{},q:0,card:0,flipped:false,matched:{},drops:{},dialogs:{},expr:{},sent:{},sort:{},grammar:{},fix:{},gm:{},read:{},rUsed:[],rCur:null,gUsed:[],gCur:null,spin:0,gift:null};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(label,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${label}</button>`;const wrap=(title,sub,body)=>`<div class="panel"><div class="tag">Shopping Quest · Mission ${page}</div><h2>${title}</h2><p class="sub">${sub}</p>${body}</div>`;const shops=[['a bakery','/ˈbeɪkəri/','A place where you can buy fresh bread, cakes and pastries.'],["a chemist’s",'/ˈkemɪsts/','A shop where you can buy medicine, vitamins and health products.'],["a newsagent’s",'/ˈnjuːzˌeɪdʒənts/','A small shop where you can buy newspapers, magazines and sometimes snacks.'],['a grocery store','/ˈɡrəʊsəri stɔː/','A shop where you can buy everyday food like milk, eggs, fruit and vegetables.'],['a department store','/dɪˈpɑːtmənt stɔː/','A large shop with sections for clothes, cosmetics and things for your home.'],['a shopping mall','/ˈʃɒpɪŋ mɔːl/','A large building with many shops, cafés and sometimes a cinema.'],['a bookshop','/ˈbʊkʃɒp/','A shop where you can buy books, comics and dictionaries.'],['a souvenir shop','/ˌsuːvəˈnɪə ʃɒp/','A shop where you can buy gifts to remember a place you have visited.']];const expressions=[['go window-shopping','/ɡəʊ ˈwɪndəʊ ˌʃɒpɪŋ/','look at things in shop windows without buying'],['a famous brand','/ə ˈfeɪməs brænd/','a well-known company or product name'],['good quality','/ɡʊd ˈkwɒləti/','well made and reliable'],['a wide choice','/ə waɪd tʃɔɪs/','many different options'],['a souvenir','/ˌsuːvəˈnɪə/','something you buy to remember a place'],['look for a bargain','/lʊk fər ə ˈbɑːɡɪn/','try to find something at a very good price'],['be worth the money','/bi wɜːθ ðə ˈmʌni/','be good enough to justify the price'],['buy goods','/baɪ ɡʊdz/','buy products or things for sale']];const test=[['It’s Saturday afternoon. What would you rather do?','Go shopping with friends','Check online stores for deals','Buy something I need','Stay home and save my money'],['You see cool trainers. What do you do?','Buy them immediately','Compare prices online','Check if they are comfortable','Keep walking'],['What’s your favourite part of shopping?','Trying on new things','Finding discounts','Buying something useful','Finishing quickly'],['You have £50. What’s your plan?','Buy something fun','Find the best deals','Buy something useful','Save most of it'],['How often do you go window-shopping?','Almost every weekend','Sometimes during sales','Only when I need something','Hardly ever'],['A shop has a huge sale. You…','Go inside immediately','Look for bargains','Check what I need','Walk past'],['What do you think about famous brands?','I love them','I buy them on sale','Quality matters more','I don’t care about brands'],['Your friend invites you to a shopping mall. You…','Say yes!','Ask about sales','Go if I need something','Suggest another activity'],['Something you love is expensive. You…','Really want to buy it','Wait for a discount','Think carefully','Decide not to buy it'],['Which sentence describes you?','Shopping is fun!','I love a bargain!','I buy what I need','I’d rather save money']];const profiles=[['The Shopaholic','You love discovering new things and exploring shops!'],['The Bargain Hunter','You love discounts and a good deal!'],['The Smart Shopper','You think before buying and value quality!'],['The Money Saver','You prefer saving and avoid unnecessary purchases!']];const talk=['Do you prefer shopping malls or small local shops? Why?','Do you enjoy window-shopping?','What famous brands do you like?','What was the last bargain you found?','Do you prefer buying souvenirs or taking photos when travelling?','What makes a product worth the money?','Which shops do you visit most often?','Do you think expensive products always have good quality?'];const grammarTalk=['How long have you had your favourite pair of shoes?','How long have you known your favourite clothing brand?','How long have you had your phone?','How long have you liked shopping online?','How long have you lived near your favourite shopping mall?','Is there a shop you haven’t visited for a long time?'];function go(i){page=Math.max(0,Math.min(sections.length-1,i));render();window.scrollTo({top:0,behavior:'smooth'});$('sidebar').classList.remove('open')};function options(items,selected,fn){return items.map((x,i)=>`<button class="choice ${selected===i?'selected':''}" onclick="${fn}(${i})">${String.fromCharCode(65+i)}. ${esc(x)}</button>`).join('')};function selectQuestion(items,answers,key){return items.map((x,i)=>`<div class="exercise"><b>${i+1}. ${esc(x)}</b><select onchange="state.${key}[${i}]=this.value;render()"><option value="">Choose…</option>${answers.map((a,j)=>`<option value="${j}" ${String(state[key][i])===String(j)?'selected':''}>${esc(a)}</option>`).join('')}</select>${state[key][i]!==undefined&&state[key][i]!==''?`<div class="feedback ${Number(state[key][i])===i?'good':'bad'}">${Number(state[key][i])===i?'✓ Correct':'Try again'}</div>`:''}</div>`).join('')};function checkInput(id,answer){let v=$(id).value.trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ');$(id+'-feedback').innerHTML=v===answer.toLowerCase().replace(/[’]/g,"'")?'<span class="good">✓ Great!</span>':`<span class="bad">Try again or check the answer.</span>`};function showAnswer(id,answer){$(id+'-feedback').innerHTML=`<span class="good">${esc(answer)}</span>`};function textFill(items,prefix){return items.map((x,i)=>`<div class="exercise"><b>${i+1}. ${esc(x[0])}</b><div class="row"><input id="${prefix}${i}" placeholder="Type your answer" aria-label="Answer ${i+1}"><button class="mint" onclick="checkInput('${prefix}${i}',${JSON.stringify(x[1]).replace(/"/g,'&quot;')})">Check</button><button class="outline" onclick="showAnswer('${prefix}${i}',${JSON.stringify(x[1]).replace(/"/g,'&quot;')})">Reveal</button></div><div class="feedback" id="${prefix}${i}-feedback"></div></div>`).join('')};function randomizer(q,key){let used=state[key+'Used'],cur=state[key+'Cur'];return `<div class="wheel" style="transform:rotate(${state.spin}deg)"><span>🎲</span></div><div class="card"><div class="tag">${used.length}/${q.length} questions</div><p class="question">${cur===null?'Press SPIN to get a question!':esc(q[cur])}</p></div><div class="row" style="justify-content:center;margin:18px">${btn('🎲 SPIN',`spin('${key}')`,'primary')}${btn('↻ Reset',`resetSpin('${key}')`,'outline')}</div><p class="sub">Questions do not repeat until all have been used. Try to use the new vocabulary!</p>`};function spin(key){const arr=key==='r'?talk:grammarTalk;let left=arr.map((_,i)=>i).filter(i=>!state[key+'Used'].includes(i));if(!left.length){alert('All questions completed! Press Reset to play again.');return}let i=left[Math.floor(Math.random()*left.length)];state[key+'Cur']=i;state[key+'Used'].push(i);state.spin+=720+Math.floor(Math.random()*360);render()};function resetSpin(key){state[key+'Cur']=null;state[key+'Used']=[];render()};function pickTest(i){state.test[state.q]=i;render()};function moveTest(d){state.q=Math.max(0,Math.min(9,state.q+d));render()};function showCard(d){state.card=(state.card+d+shops.length)%shops.length;state.flipped=false;render()};function markFix(i){state.fix[i]=!state.fix[i];render()};function render(){let html='';switch(page){case 0:html=`<div class="hero"><div class="tag">An interactive English adventure</div><h1>Shopping Quest!</h1><p>Discover your shopping personality, explore shops, practise useful phrases and grammar, then help Oliver solve a birthday shopping disaster.</p>${btn('Start the adventure →','go(1)','primary')}</div><div class="grid">${[['🛍️','Shopping Personality','10-question personality test',1],['🏬','Shops & Vocabulary','Flashcards, matching and sorting',2],['🎲','Shopping Talk','Random discussion questions',10],['⏳','Grammar Mission','Present Perfect · for / since',11],['📖','Oliver’s Story','Reading and comprehension',18],['🎁','Final Mission','Choose a present and write a message',22]].map(x=>`<div class="tile"><div style="font-size:33px">${x[0]}</div><h3>${x[1]}</h3><p class="sub">${x[2]}</p>${btn('Open →',`go(${x[3]})`,'outline')}</div>`).join('')}</div>`;break;
case 1:{let q=state.q,done=Object.keys(state.test).length===10;let count=[0,1,2,3].map(n=>Object.values(state.test).filter(x=>x===n).length),winner=count.indexOf(Math.max(...count));html=wrap('What Kind of Shopper Are You?','Choose one answer for each question. Discover your shopping personality!',done?`<div class="result">✨ ${profiles[winner][0]}</div><p>${profiles[winner][1]}</p><p class="sub">For fun — not a scientific personality assessment.</p><p><b>Discuss:</b> Do you agree with your result? What do you spend your pocket money on?</p>${btn('Take the test again',"state.test={};state.q=0;render()",'peach')}`:`<div class="tag">Question ${q+1} of 10</div><div class="progress"><div style="width:${Object.keys(state.test).length*10}%"></div></div><p class="question">${test[q][0]}</p>${options(test[q].slice(1),state.test[q],'pickTest')}<div class="row">${btn('← Back','moveTest(-1)','outline')}${btn('Next question →','moveTest(1)','primary')}</div><p class="sub">Answered ${Object.keys(state.test).length} of 10. You can revisit any answer.</p>`);break}
case 2:html=wrap('Shops & Places','Read the definition, guess the shop, then flip the card.',`<div class="card"><div class="tag">Flashcard ${state.card+1}/8</div><p class="question">${state.flipped?shops[state.card][0]:'Guess the shop!'}</p><div class="ipa">${state.flipped?shops[state.card][1]:''}</div><p class="def">${shops[state.card][2]}</p>${btn(state.flipped?'Hide answer':'Reveal the shop',"state.flipped=!state.flipped;render()",'primary')}</div><div class="row" style="justify-content:space-between;margin-top:18px">${btn('← Previous card','showCard(-1)','outline')}${btn('Next card →','showCard(1)','outline')}</div><p class="sub">Say a sentence: “I go to a bakery when I want fresh bread.”</p>`);break;
case 3:{let defs=[5,1,6,0,7,4,3,2].map(i=>shops[i][2]);html=wrap('Match the Definitions','Choose the correct description for each shop.',shops.map((s,i)=>`<div class="exercise"><b>${i+1}. ${s[0]}</b><select onchange="state.matched[${i}]=this.value;render()"><option value="">Choose a definition…</option>${defs.map((d,j)=>`<option value="${j}" ${String(state.matched[i])===String(j)?'selected':''}>${esc(d)}</option>`).join('')}</select>${state.matched[i]!==undefined?`<div class="feedback ${defs[Number(state.matched[i])]===s[2]?'good':'bad'}">${defs[Number(state.matched[i])]===s[2]?'✓ Correct!':'Try another description.'}</div>`:''}</div>`).join(''));break}
case 4:{let items=[['🥐 Croissant',0],['💊 Vitamins',1],['📚 Novel',6],['🥛 Milk',3],['📰 Newspaper',2],['🧸 Souvenir',7],['👕 T-shirt',4],['👟 Trainers',4]];html=wrap('Drag & Drop Shops','Drag each item into a suitable shop. On touchscreens, tap an item and then tap a shop.',`<div class="panel" style="background:var(--cream)"><b>Shopping items</b><div>${items.map((it,i)=>`<span class="dragitem" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" onclick="window.selectedDrag=${i};document.querySelectorAll('.dragitem').forEach(x=>x.style.outline='');this.style.outline='3px solid #7762b9'">${it[0]}</span>`).join('')}</div></div><div class="grid">${shops.map((s,i)=>`<div class="shopdrop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');dropItem(Number(event.dataTransfer.getData('text/plain')),${i})" onclick="if(window.selectedDrag!==undefined)dropItem(window.selectedDrag,${i})"><b>🏬 ${s[0]}</b><div>${items.map((it,j)=>state.drops[j]===i?`<span class="chip">${it[0]} ${it[1]===i?'✓':'↻'}</span>`:'').join('')}</div></div>`).join('')}</div><p class="sub">Correct: ${items.filter((x,i)=>state.drops[i]===x[1]).length}/8. Try saying: “You can buy a novel at a bookshop.”</p>`);break}
case 5:html=wrap('Complete the Dialogues','Write the missing shop name.',textFill([['I need some medicine. There is a _____ next to the supermarket.',"chemist's"],['Where did you buy this novel? At the new _____.','bookshop'],['I want to remember London. Let’s visit a _____.','souvenir shop'],['Where can I buy fresh bread? At the _____.','bakery'],['Let’s visit lots of shops in one building. Let’s go to the _____.','shopping mall'],['I need a magazine. There’s a _____ near the station.',"newsagent's"]],'d'));break;
case 6:html=wrap('Useful Shopping Expressions','Learn eight expressions. Read the definition and use each phrase in a sentence.',`<div class="grid">${expressions.map((e,i)=>`<div class="tile"><div class="tag">Expression ${i+1}</div><h3>${e[0]}</h3><div class="ipa">${e[1]}</div><p>${e[2]}</p></div>`).join('')}</div>`);break;
case 7:{let meanings=['look at shop windows without buying','find something at a good price','be good enough to justify the price','a well-known company or product name','have many options to choose from'];let labels=['go window-shopping','look for a bargain','be worth the money','a famous brand','a wide choice'];html=wrap('Match the Expressions','Choose the correct meaning for each expression.',labels.map((s,i)=>`<div class="exercise"><b>${i+1}. ${s}</b><select onchange="state.expr[${i}]=this.value;render()"><option value="">Choose meaning…</option>${[2,4,0,3,1].map(j=>`<option value="${j}" ${String(state.expr[i])===String(j)?'selected':''}>${meanings[j]}</option>`).join('')}</select>${state.expr[i]!==undefined?`<div class="feedback ${Number(state.expr[i])===i?'good':'bad'}">${Number(state.expr[i])===i?'✓ Correct':'Try again'}</div>`:''}</div>`).join(''));break}
case 8:html=wrap('Complete the Shopping Sentences','Choose the best shopping expression.',[['These headphones are expensive, but they are…','worth the money','a wide choice','window-shopping'],['I don’t want to buy anything. I’m just…','going window-shopping','buying goods','a famous brand'],['This store has… of clothes.','a wide choice','a souvenir','good quality'],['I don’t have much money, so I’m…','looking for a bargain','buying goods','a souvenir'],['Nike is an example of…','a famous brand','a shopping mall','a souvenir']].map((q,i)=>`<div class="exercise"><b>${i+1}. ${q[0]}</b>${q.slice(1).map((a,j)=>`<button class="choice ${state.sent[i]===j?(j===0?'correct':'wrong'):''}" onclick="state.sent[${i}]=${j};render()">${a}</button>`).join('')}</div>`).join(''));break;
case 9:html=wrap('Shopping Problems','Read each problem. Recommend a shop or a shopping strategy. Explain why.',[['🎂','Emma’s Problem','My best friend’s birthday is tomorrow. I only have £15. Where should I go and what could I buy?'],['👟','Jack’s Problem','I want trainers from a famous brand, but they are expensive. Are they worth the money?'],['🗺️','Sophie’s Problem','I am visiting London and want something special to remember my trip. What should I buy?']].map(x=>`<div class="tile" style="margin:12px 0"><h3>${x[0]} ${x[1]}</h3><p>${x[2]}</p><textarea placeholder="I think ... because ..." rows="2" style="width:100%;padding:12px;border:1px solid #ddd4e8;border-radius:12px"></textarea></div>`).join(''));break;
case 10:html=wrap('Shopping Talk Randomizer','Spin, answer, and try to use at least one new shopping expression.',randomizer(talk,'r'));break;
case 11:html=wrap('Present Perfect · FOR / SINCE','Look at the examples and remember the rule.',`<div class="grid"><div class="tile"><h2>FOR ⏳</h2><b>A period of time</b><p>How long?</p><p>for two days<br>for three years<br>for a long time<br>for ages</p></div><div class="tile"><h2>SINCE 📅</h2><b>A starting point</b><p>Since when?</p><p>since Monday<br>since 2022<br>since last summer<br>since I was ten</p></div></div><div class="statement"><b>Present Perfect = have / has + past participle (V3)</b><p>✓ I <b>have known</b> this shop <b>for</b> years.</p><p>✓ She <b>hasn't visited</b> the mall <b>since</b> July.</p><p>❓ How long <b>have</b> you <b>had</b> these trainers?</p></div><p class="question">Grammar discovery</p><p>I’ve loved this shopping mall <b>for three years</b>.<br>My family has shopped here <b>since 2020</b>.</p><p>What is the difference between <b>for</b> and <b>since</b>?</p>`);break;
case 12:html=wrap('FOR or SINCE?','Sort the time expressions into the correct group.',[['three months','for'],['last Friday','since'],['2022','since'],['a long time','for'],['yesterday','since'],['two weeks','for'],['I was seven','since'],['ages','for']].map((x,i)=>`<div class="exercise row" style="justify-content:space-between"><b>${x[0]}</b><div>${['for','since'].map(v=>`<button class="${state.sort[i]===v?(v===x[1]?'mint':'peach'):'outline'}" onclick="state.sort[${i}]='${v}';render()">${v.toUpperCase()}</button>`).join(' ')}</div></div>`).join(''));break;
case 13:html=wrap('Complete the Shopping Stories','Use the Present Perfect form and FOR or SINCE. Write both missing parts separated by a comma.',textFill([['Emma _____ (love) this brand _____ 2021.','has loved, since'],['I _____ (not visit) the mall _____ three months.',"haven't visited, for"],['My parents _____ (shop) here _____ ten years.','have shopped, for'],['Jack _____ (want) new trainers _____ last summer.','has wanted, since'],['We _____ (know) this bakery _____ we were children.','have known, since'],['Sophie _____ (not buy) anything online _____ January.',"hasn't bought, since"]],'g'));break;
case 14:{let fixes=[['I’ve loved this brand for 2020.','I’ve loved this brand since 2020.'],['She has shopped here since five years.','She has shopped here for five years.'],['We haven’t went shopping for two weeks.','We haven’t been shopping for two weeks.'],['He has wanted new headphones for last month.','He has wanted new headphones since last month.'],['I have know this bookshop since I was ten.','I have known this bookshop since I was ten.']];html=wrap('Fix the Shopping Reviews','Find the mistake. Say the correction, then tap Reveal.',fixes.map((x,i)=>`<div class="exercise"><b>${i+1}. ${x[0]}</b><div style="margin-top:10px">${btn(state.fix[i]?'Hide correction':'Reveal correction',`markFix(${i})`,'outline')}</div>${state.fix[i]?`<p class="good">✓ ${x[1]}</p>`:''}</div>`).join(''));break}
case 15:html=wrap('Match the Grammar Questions','Match each question to a suitable answer.',[['How long have you had these trainers?','For about six months.'],['How long has she liked this brand?','Since last summer.'],['How long have they lived near the mall?','For five years.'],['How long have you known this bookshop?','Since I was eight.']].map((x,i)=>`<div class="exercise"><b>${i+1}. ${x[0]}</b><select onchange="state.gm[${i}]=this.value;render()"><option value="">Choose an answer…</option>${[2,0,3,1].map(j=>`<option value="${j}" ${String(state.gm[i])===String(j)?'selected':''}>${[['How long have you had these trainers?','For about six months.'],['How long has she liked this brand?','Since last summer.'],['How long have they lived near the mall?','For five years.'],['How long have you known this bookshop?','Since I was eight.']][j][1]}</option>`).join('')}</select>${state.gm[i]!==undefined?`<div class="feedback ${Number(state.gm[i])===i?'good':'bad'}">${Number(state.gm[i])===i?'✓ Good match':'Try another answer'}</div>`:''}</div>`).join(''));break;
case 16:html=wrap('Shopping History Randomizer','Spin and answer using the Present Perfect. Add FOR or SINCE where possible.',randomizer(grammarTalk,'g'));break;
case 17:html=wrap('Two Truths & a Lie','Complete three sentences. Make two true and one false. Your partner guesses the lie.',`<div class="exercise">1. I’ve liked <input placeholder="a brand / a shop"> for <input placeholder="a period of time"></div><div class="exercise">2. I’ve had <input placeholder="something I own"> since <input placeholder="a starting point"></div><div class="exercise">3. I haven’t visited <input placeholder="a place"> for <input placeholder="a period of time"></div><p class="sub">Ask follow-up questions to catch the lie!</p>`);break;
case 18:html=wrap('Oliver’s Shopping Disaster','Read Oliver’s message. He needs your help before his friend’s birthday!',`<div class="reading"><b>💬 Message from Oliver</b><p>Hey!</p><p>I need your help! My best friend Max is turning 13 tomorrow, and I still <strong>haven’t bought</strong> him a present.</p><p>I’ve known Max <strong>since</strong> primary school. He’s loved video games <strong>for</strong> years, but he already has lots of them.</p><p>I’ve visited three shops today. First, I went to a <strong>department store</strong>, but everything was too expensive. Then I visited a <strong>bookshop</strong>, but I couldn’t find anything interesting. Finally, I went <strong>window-shopping</strong> at the mall.</p><p>I found some headphones from a <strong>famous brand</strong>. They look cool, but they cost £60! I’m not sure they’re <strong>worth the money</strong>.</p><p>I’ve only got £35 to spend. What should I do?</p><p>Oliver</p></div><p class="sub">Before reading: Do you buy birthday presents early or at the last minute?</p>`);break;
case 19:{let checks=[['Oliver has already bought a present for Max.',false,'He has not bought a present yet.'],['Oliver has known Max since primary school.',true,'He has known Max since primary school.'],['Max has loved video games for years.',true,'Max has loved video games for years.'],['Oliver found an interesting book.',false,'He could not find anything interesting.'],['The headphones cost £35.',false,'They cost £60. Oliver has £35.']];html=wrap('Reading Check: True or False?','Choose True or False. Correct the false statements.',checks.map((x,i)=>`<div class="exercise"><b>${i+1}. ${x[0]}</b><div class="row" style="margin-top:10px">${[true,false].map(v=>`<button class="${state.read[i]===v?(v===x[1]?'mint':'peach'):'outline'}" onclick="state.read[${i}]=${v};render()">${v?'True':'False'}</button>`).join('')}</div>${state.read[i]!==undefined?`<div class="feedback ${state.read[i]===x[1]?'good':'bad'}">${x[2]}</div>`:''}</div>`).join(''));break}
case 20:html=wrap('Vocabulary Detective','Find the word or phrase in Oliver’s message that matches each definition.',textFill([['A large shop with different sections.','department store'],['Looking at shops without buying anything.','window-shopping'],['A well-known company or product name.','famous brand'],['Good enough to justify the price.','worth the money'],['The amount of money you can spend.','budget']],'v')+'<p class="sub">Challenge: “Budget” is a useful extra word. Oliver says he has £35 to spend.</p>');break;
case 21:html=wrap('Grammar Detective','Find Present Perfect in Oliver’s message. Complete the sentences.',textFill([['Oliver has known Max _____ primary school.','since'],['Max has loved video games _____ years.','for'],['Oliver _____ visited three shops today.','has']],'gd')+'<p class="sub">Bonus: Find two more examples of Present Perfect in the story and explain them.</p>');break;
case 22:{let gifts=[['🎧','Wireless headphones',60,'Famous brand · Over budget'],['🖱️','Gaming mouse',25,'Good quality · Useful for gaming'],['👕','Gaming T-shirt',18,'Fun design · Affordable'],['🎲','Board game',30,'Fun to play with friends']];html=wrap('Help Oliver Choose a Present!','Oliver has £35. Which present should he buy for Max?',`<div class="grid">${gifts.map((g,i)=>`<div class="tile"><div style="font-size:40px">${g[0]}</div><h3>${g[1]}</h3><h2>£${g[2]}</h2><p class="sub">${g[3]}</p>${btn(state.gift===i?'✓ Selected':'Choose this',`state.gift=${i};render()`,state.gift===i?'primary':'outline')}</div>`).join('')}</div>${state.gift===null?'':`<div class="result">${state.gift===0?'Oops! £60 is over Oliver’s £35 budget.':'Great! This present fits Oliver’s budget.'}</div><p>Explain your choice using <b>worth the money</b>, <b>good quality</b>, or <b>look for a bargain</b>.</p>`}`);break}
case 23:html=wrap('Write to Oliver','Write 50–70 words. Recommend a present and explain why it is a good choice.',`<div class="statement">Hi Oliver! I think you should buy…<br>It’s a good choice because…<br>You’ve known Max since…<br>I think it’s worth the money because…</div><div class="exercise"><textarea id="finalText" rows="9" placeholder="Hi Oliver! I think you should..." oninput="countWords()"></textarea><p class="sub" id="wordCount">0 words · Aim for 50–70</p>${btn('Copy my message',"navigator.clipboard?.writeText($('finalText').value).then(()=>alert('Copied!')).catch(()=>alert('Select the text to copy.'))",'primary')}</div><div class="result">🎉 Mission Complete! You are a Shopping Quest Champion!</div>`);break}
$('screen').innerHTML=html;$('menu').innerHTML=sections.map((s,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${i===0?'⌂':String(i).padStart(2,'0')} · ${s}</button>`).join('');$('prev').disabled=page===0;$('next').disabled=page===sections.length-1;document.title=sections[page]+' | Shopping Quest';}
function dropItem(item,shop){state.drops[item]=shop;window.selectedDrag=undefined;render()}function countWords(){let s=$('finalText').value.trim();$('wordCount').textContent=(s?s.split(/\s+/).length:0)+' words · Aim for 50–70'}render();
